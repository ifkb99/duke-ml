[project]
name = "duke-ml"
version = "0.1.0"
description = "Neural network training for The Duke board game"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flax>=0.12.5",
    "jax[cuda13]>=0.9.1",
    "optax>=0.2.6",
    "orbax>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["training"]
