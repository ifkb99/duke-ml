# Every push to main: test, build the Docker image, push it to ghcr.io, then
# SSH to the server and have it run the new image. deploy/README.md has the
# one-time server setup.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check the network came through Git LFS
        run: |
          size=$(stat -c %s packages/web/public/models/duke-zero.q4.bin)
          [ "$size" -gt 100000 ] || { echo "duke-zero.q4.bin is $size bytes: an LFS pointer, not the model"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    env:
      HOST: 72.62.114.183
      DEPLOY_USER: djneko
      # The server's host key (SHA256:gNZUcA/2b/7QOYTs3WECNAMka4kzfKBGM31WgGaeDi4)
      HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK2PUlYDXbW4fq4kvsN7m2Y/B1RoJGeeA6U7XpdrC1FK
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$HOST $HOST_KEY" > ~/.ssh/known_hosts
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "::error::The DEPLOY_SSH_KEY secret is missing, or not a passphrase-free OpenSSH private key"; exit 1
          fi
          echo "::notice::Deploy key $(ssh-keygen -lf ~/.ssh/deploy_key.pub)"
          # Errors go to an annotation too: those are readable without the job log
          if ! ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                   "$DEPLOY_USER@$HOST" "duke-deploy/deploy.sh ${{ github.sha }}" 2> ssh.err; then
            cat ssh.err
            echo "::error::Deploy failed: $(tail -n 3 ssh.err | tr '\n' ' ')"
            exit 1
          fi
          cat ssh.err
      - name: Check the site is up
        run: |
          for i in $(seq 1 12); do
            curl -fsS -o /dev/null https://duke.nyaaa.fun/ && exit 0
            sleep 5
          done
          echo "duke.nyaaa.fun did not answer after the deploy"; exit 1
