# Every push to main: test, build the Docker image, push it to ghcr.io, then
# SSH to the server and have it run the new image. deploy/README.md has the
# one-time setup. Until the DEPLOY_USER variable is set the deploy job is
# skipped (the image still builds).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check the network came through Git LFS
        run: |
          size=$(stat -c %s packages/web/public/models/duke-zero.q4.bin)
          [ "$size" -gt 100000 ] || { echo "duke-zero.q4.bin is $size bytes: an LFS pointer, not the model"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: vars.DEPLOY_USER != ''
    runs-on: ubuntu-latest
    env:
      HOST: 72.62.114.183
      # The server's host key (SHA256:gNZUcA/2b/7QOYTs3WECNAMka4kzfKBGM31WgGaeDi4)
      HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK2PUlYDXbW4fq4kvsN7m2Y/B1RoJGeeA6U7XpdrC1FK
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.Srv }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$HOST $HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$HOST" "duke-deploy/deploy.sh ${{ github.sha }}"
      - name: Check the site is up
        run: |
          for i in $(seq 1 12); do
            curl -fsS -o /dev/null https://duke.nyaaa.fun/ && exit 0
            sleep 5
          done
          echo "duke.nyaaa.fun did not answer after the deploy"; exit 1
