# nginx for the built web app (Dockerfile copies this to conf.d/default.conf).
#
# Cross-origin isolation (COOP/COEP) lets the neural network AI run
# onnxruntime-web on several CPU threads; phones without WebGPU need it.
# Everything the page loads must then be same-origin or CORS (it all is: the
# fonts are bundled).
#
# The service worker (sw.js, from vite-plugin-pwa) keeps its own copy of the
# app for offline play and looks for a new sw.js on every visit, so sw.js and
# index.html must never be cached by the browser: `location /` below.
#
# Note: an add_header inside a location drops all of the server's add_headers,
# so locations below use `expires` (not add_header) for caching.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # The WebAssembly runtime is 28 MB (7 MB gzipped): serve the .gz files the
    # Docker build precompresses, and compress anything else on the fly.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json application/wasm image/svg+xml;

    # Hashed build output never changes under the same name.
    location /assets/ {
        expires max;
        location ~* \.mjs$ { types { } default_type text/javascript; expires max; }
        location ~* \.wasm$ { types { } default_type application/wasm; expires max; }
    }

    # The network is replaced in place when retrained: always revalidate (a
    # 304 when unchanged).
    location /models/ {
        types { } default_type application/octet-stream;
        expires epoch;
    }

    # The link preview image (og:image in index.html) is shown by other sites:
    # this add_header replaces the server's three, same-origin among them.
    location = /og.png {
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        expires epoch;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires epoch;
    }
}
